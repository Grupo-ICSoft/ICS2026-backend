name: CI/CD Pipeline TP3

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-lint:
    name: Build y Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: Verificar Formato (Linter)
        run: dotnet format Dsw2025Tpi.sln --verify-no-changes

      - name: Compilar en Release
        run: dotnet build Dsw2025Tpi.sln -c Release --no-restore

  run-tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Dsw2025Tpi.sln

      - name: Ejecutar pruebas (Unit + Integration)
        id: dotnet-test
        continue-on-error: true
        run: |
          dotnet test Dsw2025Tpi.sln -c Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Subir resultados .trx como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-trx
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

      - name: Notificar fallo en pruebas (Quality Gate)
        if: steps.dotnet-test.outcome == 'failure'
        run: |
          echo "::error title=Quality Gate Fallido::Una o más pruebas fallaron. Se bloquea el build de Docker y el despliegue a Azure."
          exit 1

  docker-and-deploy:
    name: Docker y Deploy
    needs: [build-and-lint, run-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Formatear nombre del repositorio a minúsculas
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Autenticar en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos para Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Construir imagen Docker (y publicar solo en push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Desplegar en Azure App Service
        if: github.event_name != 'pull_request'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.APP_SERVICE_NAME || vars.AZURE_WEBAPP_NAME || 'ics2026-api' }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
